<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fixed palette, not theme-mirrored: this document can't see the page's
       manual theme toggle, only the OS scheme, so trying to match it would
       just as often mismatch it. A brand mark stays recognizable either way. -->
  <rect width="64" height="64" rx="12" fill="#fdfdfc" />
  <!-- Uppercase, heavy weight, system sans (not the monospace used elsewhere,
       and not IBM Plex Sans/Newsreader — a standalone favicon document can't
       load Google Fonts, so it needs a real system-installed stack). Tab
       icons render at 16px in practice; anything lighter or more detailed
       than this turns to mush at that size. -->
  <text x="32" y="31.3" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#b3654a">DM</text>
</svg>
